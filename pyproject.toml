[project]
name = "strategic-miscalibration"
version = "0.1.0"
description = "A repeated signaling game for studying strategic miscalibration in LLM confidence reports."
authors = [
    {name = "Raghu Arghal", email = "rarghal@seas.upenn.edu"},
]
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.12"

# The base install reproduces the paper offline from the shipped data. Querying a model is the `llm`
# extra, so a reader who only wants to check the paper never installs litellm.
dependencies = [
    "jinja2>=3.1.6",
    "matplotlib>=3.10.8",
    "numpy>=2.0",
    "pandas>=2.3.3",
    "pydantic>=2.9",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
llm = [
    "datasets>=4.4.1",
    "litellm>=1.80.11",
    "tenacity>=9.1.2",
]

[project.scripts]
smc = "strategic_miscalibration.cli.main:main"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/strategic_miscalibration"]

[tool.ruff]
line-length = 119
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "BLE", "SIM", "RET", "ARG", "PTH", "RUF"]
# Greek letters are the paper's notation (σ, ρ, μ, δ, κ, Ψ); they are intended, not confusables.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "slow: exact enumerations over many random instances (deselect with -m 'not slow')",
]
