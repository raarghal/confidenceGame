# Type-independence check: a low-ability agent, belief-elicited, on 20 low-trust states (Appendix P).
name = "wL_gate"
setting = "toy"
model = "together_ai/openai/gpt-oss-120b"
temperature = 0.7
max_tokens = 2048
arms = ["minimal_clarified"]
samples = 20
conjecture = true
agent_ability = "L"

[grid]
h = [0.1, 0.3]
mu = [0.1, 0.3, 0.5, 0.7, 0.9]
delta = [0.05, 0.65]
