# Clause gate: semantics arm on 20 matched states (Appendix M clause effects).
name = "e0_semantics_check"
setting = "toy"
model = "together_ai/openai/gpt-oss-120b"
temperature = 0.7
max_tokens = 2048
arms = ["minimal_semantics"]
samples = 20
conjecture = false
agent_ability = "H"

[grid]
h = [0.1, 0.3]
mu = [0.1, 0.3, 0.5, 0.7, 0.9]
delta = [0.15, 0.55]
